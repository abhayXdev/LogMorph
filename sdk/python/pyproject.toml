[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logmorph"
version = "0.1.3"
description = "Ultra-lightweight, zero-dependency telemetry and log shipping client for LogMorph."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "abhayXdev", email = "abhaypal058@gmail.com" }
]
keywords = [
    "logging",
    "telemetry",
    "observability",
    "log-shipping",
    "metrics",
    "cloud",
    "serverless",
    "microservices",
    "monitoring",
    "zero-dependency",
    "logmorph",
    "async-logging"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://logmorph.onrender.com"
Documentation = "https://github.com/abhayXdev/LogMorph#readme"
Repository = "https://github.com/abhayXdev/LogMorph"
Issues = "https://github.com/abhayXdev/LogMorph/issues"
Changelog = "https://github.com/abhayXdev/LogMorph/releases"
