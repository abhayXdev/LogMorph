[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logmorph"
version = "0.1.0"
description = "Lightweight zero-dependency telemetry and log shipping client for LogMorph."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Abhay Paul", email = "abhaypal058@gmail.com" }
]
keywords = [
    "logging",
    "telemetry",
    "observability",
    "logmorph",
    "cloud",
    "serverless",
    "monitoring"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://logmorph.onrender.com"
Repository = "https://github.com/abhaypaul058/MINIproject"
Issues = "https://github.com/abhaypaul058/MINIproject/issues"
