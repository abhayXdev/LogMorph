[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logmorph"
version = "0.1.0"
description = "Universal Log Pre-processing Framework — Multi-tenant SaaS platform for automatic log detection, parsing, normalization, and enrichment."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "abhayXdev" },
]
keywords = ["logs", "siem", "parsing", "security", "normalization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Logging",
]

[project.urls]
Repository = "https://github.com/abhayXdev/LogMorph"

[tool.setuptools.packages.find]
where = ["src"]

# --- Ruff (Linter + Formatter) ---
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["logmorph"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-v --tb=short"

# --- Mypy ---
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
